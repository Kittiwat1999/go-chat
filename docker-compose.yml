services:
  api:
    build:
      context: ./chat-backend
      dockerfile: Dockerfile.dev
    container_name: go-chat-api
    restart: unless-stopped
    volumes:
      - ./chat-backend:/app
    env_file:
      - .env.dev
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - mongo-network
      - app-network

  web:
    build:
      context: ./web
    container_name: go-chat-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    env_file:
      - .env.dev
    environment:
      CI: "true"
    depends_on:
      - api
    networks:
      - app-network
      
volumes:
  web_node_modules:

networks:
  app-network:
    driver: bridge
  mongo-network:
    external: true
    name: dev-services_mongo-network
